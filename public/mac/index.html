<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Brand My Mac — Let your brand travel</title>
    <meta name="description" content="24 sticker spots on a MacBook Air M5 from $25 to $240. Claim a spot and your logo travels to cafés, coworking spaces and every build-in-public video." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe
      id="mac-frame"
      src="https://mac-ochre.vercel.app"
      allow="fullscreen; clipboard-read; clipboard-write"
      title="Brand My Mac"
    ></iframe>
    <script>
      (function() {
        var frame = document.getElementById('mac-frame');
        if (frame) {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          if (search || hash) {
            frame.src = 'https://mac-ochre.vercel.app' + search + hash;
          }
        }
      })();
    </script>
  </body>
</html>
